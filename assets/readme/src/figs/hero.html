<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x514">
<title>AI六项全能·限时高压挑战赛</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .frame { padding: 0; }
  .abs { position: absolute; white-space: nowrap; }

  /* Header: quiet, left-aligned; the six lanes below are the one bold element. */
  .title { left: 32px; top: 26px; font-size: 30px; font-weight: 700; line-height: 38px; letter-spacing: .5px; }
  .sub { left: 33px; top: 68px; font-family: var(--font-num); font-size: 17px; font-weight: 500; line-height: 22px; letter-spacing: .3px; color: var(--ink-2); }
  .rule { right: 32px; top: 32px; text-align: right; font-size: 15px; line-height: 24px; color: var(--ink); }
  .rule .faint { font-size: 13px; }

  /* Group rows: which kind of task the lanes below belong to, and who grades it. */
  .group { font-size: 13px; line-height: 18px; color: var(--ink-2); }
  .group b { font-size: 15px; font-weight: 700; color: var(--ink); margin-right: 10px; }
  .group .num { color: var(--ink); font-weight: 600; }
  .colhead { font-size: 12px; line-height: 16px; color: var(--ink-3); }

  .lane-no { width: 18px; text-align: center; font-size: 16px; color: var(--ink-3); line-height: 20px; }
  .lane-icon { width: 20px; height: 20px; display: block; }
  .lane-name { font-size: 15px; font-weight: 500; line-height: 20px; }
  .count { text-align: right; width: 40px; line-height: 20px; }
  .count b { font-family: var(--font-num); font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
  .count span { font-size: 13px; color: var(--ink-2); margin-left: 2px; }

  /* A task: a pill whose length is its time limit. */
  .task { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 11px; gap: 6px;
          border: 1.5px solid var(--c); background: var(--t); border-radius: 15px; height: 30px; }
  .task .tn { font-size: 13px; line-height: 18px; color: var(--ink); }
  .task .tm { font-family: var(--font-num); font-size: 14px; font-weight: 600; color: var(--c); font-variant-numeric: tabular-nums; }
  .task .tm small { font-family: var(--font-cn); font-size: 11px; font-weight: 400; margin-left: 2px; }

  .foot { font-size: 13px; line-height: 18px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="frame" id="f">
  <svg id="lines" class="abs" style="left:0;top:0" width="960" height="514"></svg>

  <div class="abs title">AI六项全能·限时高压挑战赛</div>
  <div class="abs sub">AI Hexathlon · Timed High-Pressure Challenge</div>
  <div class="abs rule">每题一次作答，无人答疑<br><span class="faint">到时直接中止，不延长</span></div>
</div>

<script>
// Facts from orchestrator/tasks.py: lanes in table order; short task names for the figure only; time limit in minutes.
const GROUPS = [
  { kind: '标准评判题', note: '<span class="num">6</span> 题，GPT 6.1 Sol 单评', lanes: [
    { key: 'reason', name: '深度推理', tasks: [['形式化证明题', 60], ['IMO原创新题', 60]] },
    { key: 'algo',   name: '算法竞赛', tasks: [['最小三角形面积', 60], ['大规模旅行商', 60], ['Transformer 加速', 60], ['电路仿真加速', 60]] },
  ]},
  { kind: '主动设计题', note: '<span class="num">5</span> 题，主体由 Claude Opus 5.5 与 GPT 6.1 Sol 各评取平均', lanes: [
    { key: 'interact', name: '复杂交互应用',   tasks: [['AE风味动效设计编辑器', 100]] },
    { key: 'game',     name: '游戏设计与开发', tasks: [['动态路由塔防', 100]] },
    { key: 'physics',  name: '物理建模与仿真', tasks: [['物理仿真连锁机关', 120]] },
    { key: 'visual',   name: '视觉设计与渲染', tasks: [['NVIDIA_B200网页艺术', 100], ['太阳雨渔港3D渲染', 100]] },
  ]},
];
const ICON = 'file:///E:/Project/AI_OneShot_Bench/assets/readme/icon-';

// Geometry (CSS px).
const TOP = 118, GROUP_H = 34, LANE_H = 46;
const X0 = 262, X1 = 928, GAP = 8;
const PX_PER_MIN = (X1 - X0 - 3 * GAP) / 240;   // the longest lane (4 x 60 min) fills the track exactly

const f = document.getElementById('f');
const svg = document.getElementById('lines');
const NS = 'http://www.w3.org/2000/svg';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function line(x1, y1, x2, y2, stroke, w = 1, dash) {
  const e = document.createElementNS(NS, 'line');
  Object.entries({ x1, y1, x2, y2, stroke, 'stroke-width': w }).forEach(([k, v]) => e.setAttribute(k, v));
  if (dash) e.setAttribute('stroke-dasharray', dash);
  svg.appendChild(e);
}
function put(cls, style, inner) {
  const d = document.createElement('div');
  d.className = 'abs ' + cls;
  d.setAttribute('style', style);
  d.innerHTML = inner;
  f.appendChild(d);
  return d;
}

let y = TOP, laneNo = 0, total = 0;
GROUPS.forEach((G, gi) => {
  // Group row: a heavier rule, the kind of task and its graders.
  line(0, y + .5, 960, y + .5, css('--line'));
  put('group', `left:32px;top:${y + 9}px`, `<b>${G.kind}</b>${G.note}`);
  if (gi === 0) put('colhead', `right:${960 - X1}px;top:${y + 11}px;text-align:right`, '每条一道题，条长按单题限时绘制');
  y += GROUP_H;
  const laneTop = y;
  G.lanes.forEach(L => {
    laneNo++;
    const cy = y + LANE_H / 2, c = `--c:var(--${L.key});--t:var(--${L.key}-tint)`;
    line(0, y + .5, 960, y + .5, css('--line-2'));
    put('lane-no num', `left:32px;top:${cy - 10}px`, String(laneNo));
    put('', `left:58px;top:${cy - 10}px`, `<img class="lane-icon" src="${ICON}${L.key}.svg" alt="">`);
    put('lane-name', `left:86px;top:${cy - 10}px`, L.name);
    put('count', `left:${X0 - 58}px;top:${cy - 10}px`, `<b>${L.tasks.length}</b><span>题</span>`);
    let x = X0;
    L.tasks.forEach(([name, min]) => {
      const w = min * PX_PER_MIN;
      put('task', `left:${x}px;top:${cy - 15}px;width:${w}px;${c}`,
          `<span class="tn">${name}</span><span class="tm">${min}<small>分钟</small></span>`);
      x += w + GAP;
      total++;
    });
    y += LANE_H;
  });
  // Start line through this group's lanes, like the line the runners leave from.
  line(X0 - 10, laneTop + 6, X0 - 10, y - 6, css('--ink'), 2);
});
line(0, y + .5, 960, y + .5, css('--line'));


// Footer.
put('foot', `left:86px;top:${y + 16}px`, `合计 <span class="num" style="color:var(--ink);font-size:16px;font-weight:600">${total}</span> 题，6 个类别`);
put('foot', `right:32px;top:${y + 16}px;text-align:right`, '每题折算 0–100 分，按权重合成模型总分');
</script>
</body>
</html>
