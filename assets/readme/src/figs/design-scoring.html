<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="size" content="960x568">
<title>设计题计分</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  .head h2 { font-size: 24px; letter-spacing: .01em; }
  .head p { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

  svg.chart { position: absolute; left: 0; top: 0; overflow: visible; }
  svg text { font-family: var(--font-cn); fill: var(--ink); }
  svg .n { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  svg .colh { font-size: 13px; fill: var(--ink-3); }
  svg .dir { font-size: 16px; font-weight: 700; }
  svg .dirv { font-size: 13px; fill: var(--ink-2); font-weight: 400; }
  svg .item { font-size: 14px; font-weight: 500; }
  svg .itemv { font-size: 13px; fill: var(--ink-2); font-weight: 400; }
  svg .point { font-size: 12.5px; fill: var(--ink-2); }
  svg .hint { font-size: 12px; fill: var(--ink-3); }
  svg .sc { font-size: 14px; }
  svg .avg { font-size: 16px; font-weight: 700; }
  svg .sum { font-size: 15px; font-weight: 700; }
  svg .sum-l { font-size: 13px; fill: var(--ink-2); }
  svg .blk { font-size: 15px; font-weight: 700; }
  svg .seg { font-size: 12px; fill: var(--ink-2); }
  svg .seg.on { fill: var(--ink); font-weight: 700; }
  svg .segv { font-size: 12px; }
  svg .total { font-size: 26px; font-weight: 700; }
  svg .total-u { font-size: 14px; fill: var(--ink-3); }

  .foot { position: absolute; left: 32px; right: 32px; bottom: 20px; font-size: 13px; line-height: 1.5; color: var(--ink-2);
          border-top: 1px dashed var(--line); padding-top: 9px; }
  .foot b { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <h2>设计题：每个分项在分值内直接打分</h2>
    <p>指南只列方向、分项、分值和一行打分点，不写评判标准。下例取物理题的一个方向，分数为示意。</p>
  </div>

  <svg class="chart" id="chart" width="960" height="568"></svg>

  <p class="foot"><b>不分档、不扣分、不清零</b>：分项得分就是评分员在分值内给的分。例外：AE 的“性能”15 分只由 GPT 6.1 Sol 评，按实测用时公式计分。</p>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const txt = (parent, x, y, cls, s, anchor = 'start') => {
  const t = el('text', { x, y, class: cls, 'text-anchor': anchor }, parent);
  t.textContent = s;
  return t;
};
const span = (t, cls, s, attrs = {}) => { const e = el('tspan', { class: cls, ...attrs }, t); e.textContent = s; return e; };
const svg = document.getElementById('chart');

/* Upper block: one direction of the physics guide, as the guide writes it, and each grader's score per item.
   Every item is a row of cells, one cell per point; a grader fills cells up to the score given (decimals allowed). */
const L = 32, R = 928;
const COLS = [
  { head: 'Claude Opus 5.5', numR: 440, gauge: 450 },
  { head: 'GPT 6.1 Sol',     numR: 636, gauge: 646 },
];
const CELL = 12, GAP = 2;

const DIR = { name: '连锁运转', value: 14 };
const ITEMS = [
  { name: '环节与布局', value: 2, point: '10 环按 2.1 做出，三维中折转成一线，标出机制', s: [1.5, 1.7] },
  { name: '交接与走通', value: 10, point: '9 次交接由物理推动、看得清，默认参数下一次敲击走到光谱', s: [6.0, 7.0] },
  { name: '实时与重放', value: 2, point: '与真实时间同步，变速、跳转与重放不改变过程', s: [1.8, 1.4] },
];
const f1 = v => v.toFixed(1);

// Column heads and the rule under them.
txt(svg, L, 122, 'colh', '评分指南（物理题共 8 个方向、29 个分项）');
COLS.forEach(c => txt(svg, c.numR - 36, 122, 'colh', c.head));
txt(svg, R, 122, 'colh', '逐项取平均', 'end');
el('line', { x1: L, x2: R, y1: 132, y2: 132, stroke: 'var(--line)', 'stroke-width': 1 }, svg);

// Direction heading, written the way the guide writes it.
{
  const t = el('text', { x: L, y: 162, class: 'dir' }, svg);
  span(t, '', DIR.name);
  span(t, 'dirv n', `共 ${DIR.value} 分`, { dx: 10 });
  txt(svg, COLS[0].gauge, 161, 'hint', '每格 1 分，格数就是分值；涂黑的部分是给的分');
}

const gauge = (x, yMid, value, score) => {
  for (let k = 0; k < value; k++) {
    const cx = x + k * (CELL + GAP), y = yMid - 7;
    el('rect', { x: cx, y, width: CELL, height: 14, rx: 2, fill: 'var(--line-2)', stroke: 'var(--line)', 'stroke-width': 1 }, svg);
    const part = Math.max(0, Math.min(1, score - k));
    if (part > 0) el('rect', { x: cx, y, width: CELL * part, height: 14, rx: part === 1 ? 2 : 0, fill: 'var(--ink)' }, svg);
  }
};

const ROW0 = 178, ROWH = 50;
ITEMS.forEach((it, i) => {
  const top = ROW0 + i * ROWH, mid = top + 19;
  const t = el('text', { x: L, y: top + 14, class: 'item' }, svg);
  span(t, '', it.name);
  span(t, 'itemv n', `${it.value} 分`, { dx: 8 });
  txt(svg, L, top + 35, 'point', it.point);
  COLS.forEach((c, j) => {
    txt(svg, c.numR, mid + 5, 'sc n', f1(it.s[j]), 'end');
    gauge(c.gauge, mid, it.value, it.s[j]);
  });
  txt(svg, R, mid + 6, 'avg n', f1((it.s[0] + it.s[1]) / 2), 'end');
});

// Sum line: the items add up to the direction's subtotal, for each grader and for the average.
{
  const y = ROW0 + ITEMS.length * ROWH + 4;
  el('line', { x1: COLS[0].numR - 44, x2: R, y1: y, y2: y, stroke: 'var(--ink)', 'stroke-width': 1.25 }, svg);
  txt(svg, COLS[0].numR - 56, y + 23, 'sum-l', '相加', 'end');
  COLS.forEach((c, j) => {
    const s = ITEMS.reduce((a, it) => a + it.s[j], 0);
    txt(svg, c.numR, y + 23, 'sum n', f1(s), 'end');
    txt(svg, c.gauge, y + 23, 'hint n', `/ ${DIR.value}`);
  });
  const avg = ITEMS.reduce((a, it) => a + (it.s[0] + it.s[1]) / 2, 0);
  txt(svg, R, y + 24, 'avg n', f1(avg), 'end');
  el('line', { x1: L, x2: R, y1: y + 46, y2: y + 46, stroke: 'var(--line)', 'stroke-width': 1 }, svg);
}

/* Lower block: the whole task. Eight directions side by side, length by value (100 in all); each filled to its averaged subtotal. */
const DIRS = [
  ['连锁运转', 14, 9.7], ['基础力学', 4, 3.0], ['双向耦合', 9, 5.5], ['液体', 12, 7.0],
  ['光学', 7, 4.6], ['参数与稳定', 8, 5.0], ['画面', 27, 17.2], ['界面与数据显示', 19, 12.3],
];
{
  const yH = 408, yBar = 458, BH = 22, SG = 4;
  const k = (R - L - SG * (DIRS.length - 1)) / 100;
  const total = DIRS.reduce((a, d) => a + d[2], 0);

  txt(svg, L, yH, 'blk', '8 个方向的平均分相加，就是本题总分');
  const t = el('text', { x: R, y: yH + 2, 'text-anchor': 'end' }, svg);
  span(t, 'total n', f1(total));
  span(t, 'total-u n', ' / 100', { dx: 4 });

  let x = L;
  DIRS.forEach(([name, v, s], i) => {
    const w = v * k, on = i === 0;
    el('rect', { x, y: yBar, width: w, height: BH, rx: 3, fill: 'var(--line-2)', stroke: on ? 'var(--ink)' : 'var(--line)', 'stroke-width': on ? 1.5 : 1 }, svg);
    el('rect', { x, y: yBar, width: w * s / v, height: BH, rx: 3, fill: on ? 'var(--ink)' : 'var(--ink-3)' }, svg);
    const cx = x + w / 2;
    if (w < 48) {
      txt(svg, cx, yBar - 24, `seg${on ? ' on' : ''}`, name.slice(0, 2), 'middle');
      txt(svg, cx, yBar - 9, `seg${on ? ' on' : ''}`, name.slice(2), 'middle');
    } else {
      txt(svg, cx, yBar - 9, `seg${on ? ' on' : ''}`, name, 'middle');
    }
    const st = el('text', { x: cx, y: yBar + BH + 17, 'text-anchor': 'middle', class: 'segv n' }, svg);
    span(st, '', f1(s), { style: 'font-weight:700' });
    span(st, '', `/${v}`, { style: 'fill: var(--ink-3)' });
    x += w + SG;
  });
}
</script>
</body>
</html>
